name: API ORIGIN
on:
  push:
    paths: ['api/**', '.github/workflows/api.yml']
  pull_request:
    paths: ['api/**']

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: origin
          POSTGRES_PASSWORD: origin_dev
          POSTGRES_DB: origin
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U origin" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          DATABASE_URL: postgres://origin:origin_dev@127.0.0.1:5433/origin
